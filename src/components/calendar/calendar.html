<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lịch - Preview</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="calendar.css">
</head>
<body class="bg-gray-50 p-8">
  <div id="component-container" class="max-w-4xl mx-auto"></div>

  <script src="calendar.js"></script>
  <script>
    // Render component for standalone preview
    if (typeof showComponent === 'function') {
      showComponent('calendar');
    } else if (typeof getCalendarComponent === 'function') {
      document.getElementById('component-container').innerHTML = getCalendarComponent();
    }
  </script>
</body>
</html>
